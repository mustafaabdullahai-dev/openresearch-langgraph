# OpenResearch — containerized deployment.
#
# The LLM backend is Hugging Face hosted inference. Set LLM_PROVIDER=hf and
# HF_TOKEN in your .env; optionally point HF_BASE_URL at your own vLLM/TGI
# endpoint (self-hosted from Hugging Face weights).

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped