# OpenResearch — containerized deployment.
#
# By default Ollama runs on the host (`http://localhost:11434`). To run it in
# a container instead, start with:
#   docker compose --profile ollama up --build
# and set OLLAMA_BASE_URL=http://ollama:11434 in your .env.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: local LLM runtime. Pull the model once:
  #   docker compose --profile ollama run ollama ollama pull qwen3:8b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  ollama-data: